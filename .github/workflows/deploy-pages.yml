name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            WebTech-Lab-Experiments/Experiment-04-Student-Profile-Dashboard/package-lock.json
            WebTech-Lab-Experiments/Experiment-05-Online-Product-Catalog/package-lock.json
            WebTech-Lab-Experiments/Experiment-06-Course-Registration-Portal/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build student profile dashboard
        working-directory: WebTech-Lab-Experiments/Experiment-04-Student-Profile-Dashboard
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - name: Build online product catalog
        working-directory: WebTech-Lab-Experiments/Experiment-05-Online-Product-Catalog
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - name: Build course registration portal
        working-directory: WebTech-Lab-Experiments/Experiment-06-Course-Registration-Portal
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - name: Assemble Pages site
        shell: bash
        run: |
          mkdir -p _site/WebTech-Lab-Experiments
          cp github-pages/index.html _site/index.html

          for project in \
            Experiment-01-Student-Grade-Calculator \
            Experiment-02-Online-Ticket-Booking \
            Experiment-03-Personal-Expense-Tracker
          do
            cp -R "WebTech-Lab-Experiments/$project" "_site/WebTech-Lab-Experiments/$project"
          done

          for project in \
            Experiment-04-Student-Profile-Dashboard \
            Experiment-05-Online-Product-Catalog \
            Experiment-06-Course-Registration-Portal
          do
            mkdir -p "_site/WebTech-Lab-Experiments/$project"
            cp -R "WebTech-Lab-Experiments/$project/dist/." "_site/WebTech-Lab-Experiments/$project/"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
